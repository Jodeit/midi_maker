<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI Maker</title>
<style>
 :root{color-scheme:dark light}
 body{font:16px/1.4 system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:20px}
 input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #888;box-sizing:border-box}
 input{width:100%;margin:6px 0}
 button{cursor:pointer;margin:6px 6px 6px 0}
 button.primary{background:#2f7cf6;color:#fff;border-color:#2f7cf6}
 #status{margin:14px 0;min-height:1.4em}.err{color:#e5484d}
 canvas{width:100%;height:220px;background:#1b1b1b;border-radius:8px}
 details{margin-top:24px}.hand{margin-right:14px}
</style></head><body>
<h2>MIDI Maker</h2>
<p>Paste a YouTube or Instagram piano link and get a MIDI file with the right and left hands on separate tracks.</p>
<input id="url" type="url" inputmode="url" placeholder="YouTube or Instagram link" autocapitalize="off">
<button class="primary" id="go">Make MIDI</button>
<div id="status"></div>
<div id="result" hidden>
  <a id="dl"><button class="primary">Download MIDI</button></a>
  <button id="play">▶ Preview</button><button id="stop">■ Stop</button>
  <label class="hand"><input type="checkbox" id="rh" checked style="width:auto"> Right</label>
  <label class="hand"><input type="checkbox" id="lh" checked style="width:auto"> Left</label>
  <canvas id="roll" width="1400" height="440"></canvas>
</div>
<details id="settings"><summary>Backend settings</summary>
  <p>Your backend address and access key (printed when you start the server; a setup link fills these in for you).</p>
  <input id="backend" placeholder="https://something.trycloudflare.com" autocapitalize="off">
  <input id="key" placeholder="Access key" autocapitalize="off">
  <button id="save">Save</button>
</details>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
// Served by the backend itself (same-Wi-Fi mode)? Then the backend is this very origin.
const SAME=!location.hostname.endsWith('github.io');
if(SAME)localStorage.backend=location.origin;
if(q.get('backend')){localStorage.backend=q.get('backend')}
if(q.get('key')){localStorage.key=q.get('key')}
if(q.get('backend')||q.get('key'))history.replaceState(null,'',location.pathname)
$('backend').value=localStorage.backend||'';$('key').value=localStorage.key||'';
if(!localStorage.backend)$('settings').open=true;
$('save').onclick=()=>{localStorage.backend=$('backend').value.trim().replace(/\/$/,'');localStorage.key=$('key').value.trim();say('Saved.')};
const say=(t,err)=>{$('status').textContent=t;$('status').className=err?'err':''};
const api=(p,o={})=>fetch(localStorage.backend.replace(/\/$/,'')+p+(p.includes('?')?'&':'?')+'key='+encodeURIComponent(localStorage.key||''),o);

$('go').onclick=async()=>{
  if(!localStorage.backend){$('settings').open=true;return say('Set the backend address first.',1)}
  $('result').hidden=true;stopPlayback();
  say('Starting…');
  try{
    const r=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value})});
    const j=await r.json();if(!r.ok)throw Error(j.error||r.status);
    for(;;){
      await new Promise(r=>setTimeout(r,2500));
      const s=await (await api('/api/jobs/'+j.id)).json();
      if(s.status==='error')throw Error(s.error);
      if(s.status==='done')break;
      say(s.step+'… (this takes a few minutes)');
    }
    const blob=await (await api('/api/jobs/'+j.id+'/midi')).blob();
    $('dl').href=URL.createObjectURL(blob);$('dl').download='two_hands.mid';
    await load(blob);$('result').hidden=false;say('Done.');
  }catch(e){say('Error: '+e.message,1)}
};

// ---- preview ----
let tracks=[],ctx=null,raf=0,total=1;
async function load(blob){
  const m=new Midi(await blob.arrayBuffer());total=m.duration||1;
  tracks=m.tracks.map(t=>({name:t.name,notes:t.notes.map(n=>({t:n.time,d:n.duration,p:n.midi,v:n.velocity}))}));
  draw(-1);
}
const colors={'Right Hand':'#4fc3f7','Left Hand':'#ffb74d'};
const on=n=>$(n==='Right Hand'?'rh':'lh').checked;
function draw(now){
  const c=$('roll'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  for(const t of tracks){if(!on(t.name))continue;g.fillStyle=colors[t.name]||'#aaa';
    for(const n of t.notes)g.fillRect(n.t/total*c.width,c.height-(n.p-24)/66*c.height,Math.max(2,n.d/total*c.width),4)}
  if(now>=0){g.fillStyle='#fff';g.fillRect(now/total*c.width,0,2,c.height)}
}
function stopPlayback(){cancelAnimationFrame(raf);if(ctx){ctx.close();ctx=null}}
$('stop').onclick=()=>{stopPlayback();draw(-1)};
$('play').onclick=()=>{
  stopPlayback();ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
  const t0=ctx.currentTime+.2;
  for(const t of tracks){if(!on(t.name))continue;
    for(const n of t.notes){
      const f=440*2**((n.p-69)/12),e=t0+n.t,o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=2*f;
      g.gain.setValueAtTime(0,e);g.gain.linearRampToValueAtTime(.25*n.v,e+.005);
      g.gain.exponentialRampToValueAtTime(.001,e+Math.min(Math.max(n.d,.3)+.6,3));
      o.connect(g);o2.connect(g);g.connect(ctx.destination);o.start(e);o2.start(e);o.stop(e+4);o2.stop(e+4)}}
  (function tick(){if(!ctx)return;const now=ctx.currentTime-t0;draw(now);if(now<total)raf=requestAnimationFrame(tick)})();
};
</script></body></html>
